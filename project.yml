name: RecordOS
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.recordos.app
    PRODUCT_NAME: RecordOS
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSScreenCaptureUsageDescription: "RecordOS needs screen recording access to capture the display you choose."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "RecordOS needs microphone access to capture your voice alongside screen recordings."
    INFOPLIST_KEY_NSPrincipalClass: NSApplication
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sign with a stable developer identity instead of ad-hoc: macOS ties screen
    # recording permission to the code signature, so ad-hoc rebuilds look like a
    # brand-new app and the permission has to be granted again every time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 6WRHL69HTD
targets:
  RecordOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.recordos.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
